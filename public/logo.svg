<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradient Accents -->
    <linearGradient id="rotaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glowing Orbit Ring -->
  <circle cx="256" cy="256" r="220" stroke="url(#ringGlow)" stroke-width="8" stroke-dasharray="16 12" fill="none" opacity="0.6" />

  <!-- Rotating Shield Segments (ROSCA Pool Vault) -->
  <path d="M 256 56 C 366.45 56 456 145.55 456 256 C 456 312 433 362.6 395.7 398.7" stroke="url(#rotaGradient)" stroke-width="36" stroke-linecap="round" fill="none" filter="url(#glow)" />
  <path d="M 256 456 C 145.55 456 56 366.45 56 256 C 56 200 79 149.4 116.3 113.3" stroke="url(#rotaGradient)" stroke-width="36" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Orbital Member Nodes -->
  <circle cx="395.7" cy="398.7" r="22" fill="#10b981" stroke="#0f172a" stroke-width="6" />
  <circle cx="116.3" cy="113.3" r="22" fill="#38bdf8" stroke="#0f172a" stroke-width="6" />
  <circle cx="456" cy="256" r="16" fill="#6366f1" />
  <circle cx="56" cy="256" r="16" fill="#10b981" />

  <!-- Center Stellar 4-Point Star Motif -->
  <path d="M 256 160 Q 256 256 160 256 Q 256 256 256 352 Q 256 256 352 256 Q 256 256 256 160 Z" fill="url(#starGradient)" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>
